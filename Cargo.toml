[package]
name = "riggy"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "A desktop mascot that idles and lip-syncs to text-to-speech output"

[features]
default = ["rhubarb", "espeak"]
# Lip-sync mode `rhubarb`: runs the Rhubarb Lip Sync program (MIT) on the speech.
rhubarb = []
# Lip-sync mode `text`: links libespeak-ng (GPL-3.0-or-later), so a riggy binary built with this feature is GPL-3.0-or-later as a whole; riggy's own source stays MIT.
espeak = ["dep:realfft"]
# VRM backend (iteration 8): bevy_vrm1 0.11 targets Bevy 0.20.
vrm = []

[dependencies]
# Pinned to the Bevy release bevy_vrm1 0.11 builds against, so adding VRM later needs no Bevy upgrade.
bevy = { version = "=0.20.1", default-features = false, features = ["3d", "jpeg"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
rand = "0.9"
# Speech playback; plays through PipeWire's ALSA plugin.
cpal = "0.18"
serde_json = "1"
# MFCCs for the text-driven lip sync.
realfft = { version = "3", optional = true }
# HTTP client of riggy-mcp, riggy-tray and examples/say.rs (plain HTTP to the local TTS server, no TLS).
ureq = { version = "3", default-features = false, features = ["json"] }
# riggy-mcp stops its ffmpeg and pw-play children when it exits.
libc = "0.2"
# riggy-tray: StatusNotifierItem tray icon (KDE, freedesktop), driven from plain threads; async-io is lighter than tokio and already in Bevy's tree.
ksni = { version = "0.3.4", default-features = false, features = ["blocking", "async-io"] }
# riggy-tray draws its icon from SVG.
resvg = { version = "0.47", default-features = false }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
