# Cyber-style girl by IBUKI-PLANET (VRM 1.0). The model brings its bones and expressions; this file only adds what it lacks.

# The long coat is bound to hips and thighs and has no working spring bones, so it would follow each leg. Riggy hangs cloth chains from the hips inside it and colliders on the legs, so it swings like her hair.
[[cloth]]
material = "N00_007_01_Tops_01_CLOTH"
bone = "hips"
release = ["leftUpperLeg", "rightUpperLeg"]
top = 0.92
chains = 20
segments = 3
inset = 1.0
stiffness = 0.6
drag = 0.3
gravity = 0.3
hit_radius = 0.02
legs = [0.07, 0.06]


# The coat's inner layer is painted dark navy in the middle, which shows as two black strips beside the front flap; its triangles there are cut away.
[[cut]]
material = "N00_007_01_Tops_01_CLOTH_01"
uv = [0.445, 0.62, 0.555, 0.82]

# The flap in the middle of the front (picked by its texture area) swings on stiffer chains of its own.
[[cloth]]
material = "N00_007_01_Tops_01_CLOTH_02"
uv = [0.452, 0.45, 0.548, 0.8]
bone = "hips"
release = ["leftUpperLeg", "rightUpperLeg"]
top = 0.85
chains = 2
segments = 3
inset = 1.0
stiffness = 6
drag = 0.5
gravity = 0.3
hit_radius = 0.02
legs = [0.07, 0.06]
