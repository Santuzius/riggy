# Cyborg girl (Auto-Rig-Pro rig, Sketchfab export). Repair the rest pose first: tools/fix_bind_pose.py.
# Avatar space: +Y up, +Z the way she faces, +X her left; model units are millimetres.

scale = 0.001

[humanoid]
hips = "root.x"
spine = "spine_02.x"
chest = "spine_03.x"
upperChest = "spine_04.x"
neck = "neck.x"
head = "head.x"
jaw = "c_jawbone.x"
leftEye = "c_eye.l"
rightEye = "c_eye.r"
leftShoulder = "shoulder.l"
leftUpperArm = "arm_stretch.l"
leftLowerArm = "forearm_stretch.l"
leftHand = "hand.l"
rightShoulder = "shoulder.r"
rightUpperArm = "arm_stretch.r"
rightLowerArm = "forearm_stretch.r"
rightHand = "hand.r"
leftUpperLeg = "thigh_stretch.l"
leftLowerLeg = "leg_stretch.l"
leftFoot = "foot.l"
leftToes = "toes_01.l"
rightUpperLeg = "thigh_stretch.r"
rightLowerLeg = "leg_stretch.r"
rightFoot = "foot.r"
rightToes = "toes_01.r"

# Expressions: bone changes at weight 1, in avatar space (rotate: axis-angle in degrees, translate: mm).
# The eyelid bones pivot in the eyeball centre; a rotation about +X swings the lid down over the eye.
[expressions.blink]
"c_eyelid_top_01.l" = { rotate = [44, 0, 0] }
"c_eyelid_top_02.l" = { rotate = [44, 0, 0] }
"c_eyelid_top_03.l" = { rotate = [44, 0, 0] }
"c_eyelid_bot_01.l" = { rotate = [-10, 0, 0] }
"c_eyelid_bot_02.l" = { rotate = [-10, 0, 0] }
"c_eyelid_bot_03.l" = { rotate = [-10, 0, 0] }
"c_eyelid_top_01.r" = { rotate = [44, 0, 0] }
"c_eyelid_top_02.r" = { rotate = [44, 0, 0] }
"c_eyelid_top_03.r" = { rotate = [44, 0, 0] }
"c_eyelid_bot_01.r" = { rotate = [-10, 0, 0] }
"c_eyelid_bot_02.r" = { rotate = [-10, 0, 0] }
"c_eyelid_bot_03.r" = { rotate = [-10, 0, 0] }

[expressions.blinkLeft]
"c_eyelid_top_01.l" = { rotate = [44, 0, 0] }
"c_eyelid_top_02.l" = { rotate = [44, 0, 0] }
"c_eyelid_top_03.l" = { rotate = [44, 0, 0] }
"c_eyelid_bot_01.l" = { rotate = [-10, 0, 0] }
"c_eyelid_bot_02.l" = { rotate = [-10, 0, 0] }
"c_eyelid_bot_03.l" = { rotate = [-10, 0, 0] }

[expressions.blinkRight]
"c_eyelid_top_01.r" = { rotate = [44, 0, 0] }
"c_eyelid_top_02.r" = { rotate = [44, 0, 0] }
"c_eyelid_top_03.r" = { rotate = [44, 0, 0] }
"c_eyelid_bot_01.r" = { rotate = [-10, 0, 0] }
"c_eyelid_bot_02.r" = { rotate = [-10, 0, 0] }
"c_eyelid_bot_03.r" = { rotate = [-10, 0, 0] }

# Rest pose corrections: the lips are slightly apart in the model; close the jaw a little.
[rest]
"c_jawbone.x" = { rotate = [-1.5, 0, 0] }

# The model has no mouth interior: a dark cavity in two halves (upper on the head, lower on the jaw) and two rows of teeth fill the opening.
[[props]]
bone = "head.x"
center = [0, 1446, 60]
size = [26, 12, 20]
color = [0.03, 0.007, 0.007]
unlit = true

[[props]]
bone = "c_jawbone.x"
center = [0, 1438, 58]
size = [25, 11, 20]
color = [0.03, 0.007, 0.007]
unlit = true

[[props]]
bone = "head.x"
center = [0, 1447, 76]
size = [14, 2.5, 5]
color = [0.8, 0.78, 0.72]

[[props]]
bone = "c_jawbone.x"
center = [0, 1440, 74]
size = [13, 2.5, 5]
color = [0.8, 0.78, 0.72]

# Mouth shapes (visemes). The jaw pivots behind the mouth (rotate +X opens it) and carries the lower lip, chin and lower teeth; the upper lip and the corners (c_lips_smile) hang on the head. Translations: +X towards her left, +Y up, +Z forward.
[expressions.aa]
"c_jawbone.x" = { rotate = [8, 0, 0] }
"c_lips_top.x" = { translate = [0, 1.5, 0] }
"c_lips_top.l" = { translate = [0, 1.2, 0] }
"c_lips_top.r" = { translate = [0, 1.2, 0] }

[expressions.ih]
"c_jawbone.x" = { rotate = [4, 0, 0] }
"c_lips_smile.l" = { translate = [2, 0.5, -1] }
"c_lips_smile.r" = { translate = [-2, 0.5, -1] }
"c_lips_top.x" = { translate = [0, 0.8, 0] }

[expressions.ou]
"c_jawbone.x" = { rotate = [4, 0, 0] }
"c_lips_smile.l" = { translate = [-10, 0, 3] }
"c_lips_smile.r" = { translate = [10, 0, 3] }
"c_lips_top.x" = { translate = [0, 0, 3] }
"c_lips_top.l" = { translate = [-2, 0, 3] }
"c_lips_top.r" = { translate = [2, 0, 3] }
"c_lips_bot.x" = { translate = [0, 0, 3] }
"c_lips_bot.l" = { translate = [-2, 0, 3] }
"c_lips_bot.r" = { translate = [2, 0, 3] }

[expressions.ee]
"c_jawbone.x" = { rotate = [2.5, 0, 0] }
"c_lips_smile.l" = { translate = [6, 1, -2] }
"c_lips_smile.r" = { translate = [-6, 1, -2] }
"c_lips_top.x" = { translate = [0, 1, 0] }
"c_lips_top.l" = { translate = [0, 0.8, 0] }
"c_lips_top.r" = { translate = [0, 0.8, 0] }

[expressions.oh]
"c_jawbone.x" = { rotate = [6, 0, 0] }
"c_lips_smile.l" = { translate = [-3.5, 0, 1.5] }
"c_lips_smile.r" = { translate = [3.5, 0, 1.5] }
"c_lips_top.x" = { translate = [0, 1, 2] }
"c_lips_bot.x" = { translate = [0, 0, 2] }
