# riggy settings; changes to [idle], [blink], [mouth] and [debug] apply while running.

[avatar]
kind = "glb"
path = "assets/models/cyborg_girl.glb"
mapping = "assets/avatars/cyborg_girl.toml"

[window]
width = 400
height = 700

# Idle motion; angles in degrees, rates in Hz.
[idle]
breath_rate = 0.25
breath_angle = 1.0
sway_rate = 0.07
sway_shift = 0.004   # sideways hip shift as a fraction of body height
sway_angle = 1.2
head_rate = 0.15
head_angle = 2.5
arm_angle = 12.0     # upper arms out from vertical
elbow_angle = 8.0

# Seconds between blinks (random in this range) and blink length.
[blink]
min_interval = 2.0
max_interval = 6.0
duration = 0.15

# Mouth: smoothing time constants in seconds for opening and closing; opening (0–1) kept in quiet stretches within speech and the stretch length in seconds after which it closes fully; speech RMS levels (full scale 1) at which the mouth starts to open and opens fully; extra delay of the mouth behind the sound in seconds.
[mouth]
time_constant = 0.04
release_time = 0.12
pause_opening = 0.15
pause_hold = 0.4
silence_level = 0.01
loud_level = 0.12
audio_latency = 0.0

# Speech socket; empty means $XDG_RUNTIME_DIR/riggy.sock (applies at startup).
[speech]
socket = ""

# Tuning aid: force expression weights, e.g. expressions = { blink = 1.0 }.
[debug]
expressions = {}
