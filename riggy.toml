# riggy settings; changes to [idle], [blink], [mouth] and [debug] apply while running.

[avatar]
kind = "glb"
path = "assets/models/cyborg_girl.glb"
mapping = "assets/avatars/cyborg_girl.toml"

[window]
width = 400
height = 700

# Idle motion; angles in degrees, rates in Hz.
[idle]
breath_rate = 0.25
breath_angle = 1.0
sway_rate = 0.07
sway_shift = 0.004   # sideways hip shift as a fraction of body height
sway_angle = 1.2
head_rate = 0.15
head_angle = 2.5
arm_angle = 12.0     # upper arms out from vertical
elbow_angle = 8.0

# Seconds between blinks (random in this range) and blink length.
[blink]
min_interval = 2.0
max_interval = 6.0
duration = 0.15

# Mouth: smoothing time constant of the mouth shapes in seconds.
[mouth]
time_constant = 0.04

# Tuning aid: force expression weights, e.g. expressions = { blink = 1.0 }.
[debug]
expressions = {}
