# Riggy's default settings. Your own go in ~/.config/riggy/riggy.toml, which needs only what differs from here; changes to [idle], [blink], [mouth], [lipsync] and [debug] apply while running.
#
# [avatar] name picks the model: ~/.local/share/riggy/models/NAME.glb, with its mapping file ~/.local/share/riggy/avatars/NAME.toml (created from riggy's default on first use). path and mapping name other files instead.

# Window: size in logical pixels; transparent = borderless with a see-through background; always_on_top works on X11 only (on Wayland the KWin script in kwin/riggy does it, see doc/usage.md); click_through lets clicks go to the windows underneath (F2 toggles it; while it is off, dragging with the left mouse button moves the window); zoom from the whole figure (0) to the face (1); turn of the figure in degrees, positive to its left. On the desktop, started by the tray, the tray's choices replace size, zoom and turn.
[window]
width = 400
height = 700
transparent = false
always_on_top = false
click_through = false
zoom = 0.0
turn = 0.0

# Idle motion; angles in degrees, rates in Hz.
[idle]
breath_rate = 0.25
breath_angle = 6.0
sway_rate = 0.25
sway_shift = 0.03
sway_angle = 6.0
head_rate = 0.15
head_angle = 15.0
arm_angle = 12.0     # upper arms out from vertical
elbow_angle = 8.0

# Seconds between blinks (random in this range) and blink length.
[blink]
min_interval = 2.0
max_interval = 6.0
duration = 0.15

# Mouth: smoothing time constants in seconds for opening and closing, and for changes of the mouth shape; opening (0–1) kept in quiet stretches within speech and the stretch length in seconds after which it closes fully; speech RMS levels (full scale 1) at which the mouth starts to open and opens fully; extra delay of the mouth behind the sound in seconds.
[mouth]
time_constant = 0.04
release_time = 0.12
shape_time = 0.07
cheek_time = 0.3     # cheeks follow "ee"/"ih" this slowly
pause_opening = 0.15
pause_hold = 0.4
silence_level = 0.01
loud_level = 0.12
audio_latency = 0.0

# Lip sync: "sound" follows loudness and spectrum and speaks at once; "rhubarb" uses Rhubarb Lip Sync's mouth shapes (closed lips on m, b, p) and starts speaking about 2 s later; "text" takes the sounds from the spoken text (any eSpeak NG language, e.g. German umlauts), times them to the audio and animates them with Rhubarb's rules, starting about 0.3 s later. F3 cycles through them while running; changes apply to the next utterance. recognizer: "phonetic" (any language) or "pocketSphinx" (English only, slower than real time). cue_time: seconds the mouth takes to follow a Rhubarb shape; cue_cheek_time: the same for the cheeks.
[lipsync]
mode = "sound"
rhubarb = "rhubarb"
recognizer = "phonetic"
cue_time = 0.05
cue_cheek_time = 0.12   # cheeks follow Rhubarb's "ee"/"ih" shapes this slowly

# Mouth shapes per Rhubarb shape (modes rhubarb and text), replacing the built-in table in src/lipsync/cues.rs (applies live). Rhubarb's shapes: A closed (m, b, p), B teeth together, lips apart (most consonants, "ee"), C open ("eh"), D wide open ("aa"), E slightly rounded, F puckered ("oo", "w"), G f/v, H l, X rest.
[lipsync.cues]
# B = { ee = 0.85 }

# Speech socket; empty means $XDG_RUNTIME_DIR/riggy.sock (applies at startup).
[speech]
socket = ""

# Tuning aid: force expression weights, e.g. expressions = { blink = 1.0 }.
[debug]
expressions = {}
